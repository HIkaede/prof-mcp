[package]
name = "prof-mcp"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only MCP queries for folded stack profiles"
license = "MIT"

[lib]
name = "prof_mcp"
path = "src/lib.rs"

[[bin]]
name = "prof-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
fs2 = "0.4"
hashbrown = "0.17"
lru = "0.18"
regex = "1"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
tempfile = "3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "io-std", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "tracing-log"] }

[dev-dependencies]
assert_matches = "1"
# Integration tests drive a full MCP client against the server; the shipped
# binary itself only needs the server half.
rmcp = { version = "3.5.1", default-features = false, features = ["client"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
