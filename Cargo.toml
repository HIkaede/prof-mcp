[package]
name = "rmdb-prof-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only MCP queries for folded stack profiles"
license = "MIT"

[lib]
name = "rmdb_prof_mcp"
path = "src/lib.rs"

[[bin]]
name = "rmdb-prof-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
hashbrown = "0.15"
lru = "0.16"
regex = "1"
rmcp = { version = "3.0.1", features = ["client", "server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_matches = "1"
tempfile = "3"
